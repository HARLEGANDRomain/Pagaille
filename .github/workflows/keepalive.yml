name: Garder la base éveillée

# L'offre gratuite de Supabase met le projet en pause après 7 jours sans activité.
# Cette tâche fait un petit appel à la base tous les 3 jours, que tu aies lu ou non.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de la fonction ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            'https://oetpbsnglqljjmkwipgv.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_lM1QoQpf8fVLyAMKuqBldA_R0nwy_wa' \
            -H 'Content-Type: application/json' -d '{}')
          echo "Réponse : $code"
          test "$code" = "200"
